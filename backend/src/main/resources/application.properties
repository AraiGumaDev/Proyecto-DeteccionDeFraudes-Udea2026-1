spring.application.name=fraud-detector
spring.jackson.property-naming-strategy=SNAKE_CASE
server.port=8080

# Ruta del archivo binario de persistencia (relativa al directorio de ejecucion)
app.datos.ruta=transacciones.dat

# Origenes permitidos para CORS (frontend React en desarrollo)
app.cors.origenes=http://localhost:3000,http://localhost:5173

# Tamano de la tabla hash (primer primo > capacidad_esperada * 1.5)
app.hash.tableSize=1543

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
